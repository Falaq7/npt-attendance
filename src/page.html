xt-align:center}.qrbox canvas{display:block;margin:24px auto;max-width:100%}.qrbox input{font-size:11px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:10px;z-index:10}.progress{width:110px;background:#e9eee8;height:5px;border-radius:8px;margin-top:8px}.progress i{display:block;height:5px;border-radius:8px;background:var(--green)}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:0 18px 25px}.heading{align-items:start;gap:12px}h1{font-size:27px}.stats{gap:8px}.stat{padding:16px}.stat strong{font-size:28px}.tablewrap{overflow:auto}.panelhead{flex-wrap:wrap}.foot{gap:15px}.search{width:100%}.heading .primary{white-space:nowrap}}
